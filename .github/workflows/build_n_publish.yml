name: Build and publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a GitHub release (tag v<version>) with the packages'
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PACKAGE_DIR: artifacts/packages

jobs:
  build:
    runs-on: ubuntu-latest
    # The packages need at least the glibc they were built against (see packaging/build-packages.sh),
    # so build on the oldest supported distribution rather than on the runner image.
    container: ubuntu:22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install build requirements
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git ca-certificates curl cmake make gcc libc6-dev pkg-config libhidapi-dev binutils

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Nerdbank.GitVersioning needs the full history to compute the git height

      - name: Trust the workspace
        # The checkout belongs to the runner user, not to the container's root.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        run: |
          dotnet tool restore
          echo "version=$(dotnet nbgv get-version -v SimpleVersion)" >> "$GITHUB_OUTPUT"

      # nfpm is downloaded by build-packages.sh into artifacts/tools (checksum verified).
      - name: Cache nfpm
        uses: actions/cache@v6
        with:
          path: artifacts/tools
          key: nfpm-${{ hashFiles('packaging/build-packages.sh') }}

      # Builds the native driver, publishes the self-contained app and builds both packages.
      # --no-bump: CI never rewrites version.json, it only warns when the month is outdated.
      - name: Build packages
        run: packaging/build-packages.sh --no-bump deb rpm

      - name: Smoke test the .deb
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            "$PWD"/artifacts/packages/ss551_*.deb
          ss551-probe info || true
          test -x /usr/lib/ss551/ss551
          test -f /usr/lib/udev/rules.d/70-redragon-ss551.rules

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ss551-${{ steps.version.outputs.version }}-packages
          path: |
            ${{ env.PACKAGE_DIR }}/*.deb
            ${{ env.PACKAGE_DIR }}/*.rpm
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release (and its tag)
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: ss551-${{ needs.build.outputs.version }}-packages
          path: packages

      - name: Check version against the tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::warning::Tag $TAG does not match the computed version $VERSION (tag with 'dotnet nbgv tag')"
          fi

      # A release created on github.com (which also pushes its tag) already exists: only attach the packages.
      # Otherwise (plain tag push or manual run) create the release.
      - name: Create release or attach packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.build.outputs.version) }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" packages/* --clobber
          else
            gh release create "$TAG" packages/* \
              --target "$GITHUB_SHA" \
              --title "Redragon SS-551 ${{ needs.build.outputs.version }}" \
              --generate-notes
          fi
