# nfpm configuration for the .deb and .rpm packages. Driven by build-packages.sh, which sets the
# SS551_* environment variables, stages the build in artifacts/stage/ and runs nfpm from the repository root.
# nfpm expands ${VAR} in scalar fields (version, prerelease) but NOT in contents src paths.
name: ss551
arch: amd64
platform: linux
version: ${SS551_VERSION}
prerelease: ${SS551_PRERELEASE}
release: 1
section: utils
priority: optional
maintainer: David Kozma <k0zi@outlook.com>
vendor: David Kozma
homepage: https://github.com/k0zi/Redragon-SS-551
license: MIT
description: |-
  Linux driver and configuration app for the Redragon SS-551 stream deck
  Unofficial user-space driver (hidapi) and Avalonia desktop app for the Redragon SS-551
  (Mirabox Stream Dock N3-family, USB 0200:2000): key images, pages, macros, long press,
  state indicator keys and a tray icon. Includes the ss551-probe command-line tool and a
  udev rule that gives the logged-in user access to the device.

contents:
  # type: tree keeps the directory structure (a trailing-slash glob flattens subfolders and collides).
  - src: artifacts/stage/app
    dst: /usr/lib/ss551
    type: tree
  - src: /usr/lib/ss551/ss551
    dst: /usr/bin/ss551
    type: symlink
  - src: /usr/lib/ss551/ss551-probe
    dst: /usr/bin/ss551-probe
    type: symlink
  - src: udev/70-redragon-ss551.rules
    dst: /usr/lib/udev/rules.d/70-redragon-ss551.rules
  # ── menu entry, autostart + icon ──
  - src: artifacts/stage/ss551.desktop
    dst: /usr/share/applications/ss551.desktop
  # Every user starts the app on login; a user turns it off with ~/.config/autostart/ss551.desktop (Hidden=true).
  - src: artifacts/stage/ss551-autostart.desktop
    dst: /etc/xdg/autostart/ss551.desktop
  - src: app/src/SS551.App/Assets/icon.png
    dst: /usr/share/icons/hicolor/256x256/apps/ss551.png
  # ── licence: Debian policy location vs. RPM %license ──
  - src: LICENSE
    dst: /usr/share/doc/ss551/copyright
    packager: deb
  - src: LICENSE
    dst: /usr/share/licenses/ss551/LICENSE
    packager: rpm
    type: license

scripts:
  postinstall: packaging/scripts/postinstall.sh
  postremove: packaging/scripts/postremove.sh

# Self-contained .NET build: only native libraries of the base system are needed.
# Hard: .NET runtime, hidapi (libss551), X11 + fontconfig (Avalonia / Skia).
# Recommended: GL/EGL/Vulkan/GTK (Avalonia rendering and dialogs), wpctl (mute indicator keys),
# gio and xdg-open (App / Open actions).
# SS551_GLIBC is computed by build-packages.sh from the built binaries.
overrides:
  deb:
    depends:
      - libc6 (>= ${SS551_GLIBC})
      - libgcc-s1
      - libstdc++6
      - zlib1g
      - libicu80 | libicu79 | libicu78 | libicu77 | libicu76 | libicu75 | libicu74 | libicu73 | libicu72 | libicu71 | libicu70 | libicu67
      - libhidapi-hidraw0
      - libx11-6
      - libice6
      - libsm6
      - libxcursor1
      - libxext6
      - libxfixes3
      - libxi6
      - libxrandr2
      - libfontconfig1
    recommends:
      - libgl1
      - libegl1
      - libvulkan1
      - libgtk-3-0t64 | libgtk-3-0
      - wireplumber
      - libglib2.0-bin
      - xdg-utils
  rpm:
    # Shared-library capabilities have the same names on Fedora/RHEL and openSUSE, unlike the package names.
    depends:
      - libc.so.6(GLIBC_${SS551_GLIBC})(64bit)
      - libstdc++.so.6()(64bit)
      - libz.so.1()(64bit)
      - (libicuuc.so.80()(64bit) or libicuuc.so.79()(64bit) or libicuuc.so.78()(64bit) or libicuuc.so.77()(64bit) or libicuuc.so.76()(64bit) or libicuuc.so.75()(64bit) or libicuuc.so.74()(64bit) or libicuuc.so.73()(64bit) or libicuuc.so.72()(64bit) or libicuuc.so.71()(64bit) or libicuuc.so.70()(64bit) or libicuuc.so.69()(64bit) or libicuuc.so.67()(64bit) or libicuuc.so.65()(64bit))
      - libhidapi-hidraw.so.0()(64bit)
      - libX11.so.6()(64bit)
      - libICE.so.6()(64bit)
      - libSM.so.6()(64bit)
      - libXcursor.so.1()(64bit)
      - libXext.so.6()(64bit)
      - libXfixes.so.3()(64bit)
      - libXi.so.6()(64bit)
      - libXrandr.so.2()(64bit)
      - libfontconfig.so.1()(64bit)
    recommends:
      - libGL.so.1()(64bit)
      - libEGL.so.1()(64bit)
      - libvulkan.so.1()(64bit)
      - libgtk-3.so.0()(64bit)
      - /usr/bin/wpctl
      - /usr/bin/gio
      - /usr/bin/xdg-open
